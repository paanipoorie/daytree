<svg viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Trunk -->
  <path d="M 100 170 L 100 90" stroke="#000" stroke-width="6" stroke-linecap="square" />
  <!-- Lower Left Branch -->
  <path d="M 100 135 L 75 110" stroke="#000" stroke-width="4" stroke-linecap="square" />
  <!-- Lower Right Branch -->
  <path d="M 100 125 L 125 100" stroke="#000" stroke-width="4" stroke-linecap="square" />
  <!-- Upper Left Branch -->
  <path d="M 100 110 L 80 90" stroke="#000" stroke-width="4" stroke-linecap="square" />
  <!-- Upper Right Branch -->
  <path d="M 100 100 L 120 80" stroke="#000" stroke-width="4" stroke-linecap="square" />
  <!-- Top Branch -->
  <path d="M 100 90 L 100 65" stroke="#000" stroke-width="4" stroke-linecap="square" />
  <!-- Leaves (Squares rotated 45 deg, centered on the tips of the branches) -->
  <rect x="70" y="105" width="10" height="10" fill="#000" transform="rotate(45 75 110)" />
  <rect x="120" y="95" width="10" height="10" fill="#000" transform="rotate(45 125 100)" />
  <rect x="75" y="85" width="10" height="10" fill="#000" transform="rotate(45 80 90)" />
  <rect x="115" y="75" width="10" height="10" fill="#000" transform="rotate(45 120 80)" />
  <rect x="95" y="60" width="10" height="10" fill="#000" transform="rotate(45 100 65)" />
</svg>