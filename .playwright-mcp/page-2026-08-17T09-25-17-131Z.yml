          - paragraph [ref=f9e84]: Unlike bloated productivity applications, DayTree doesn't waste your time. It loads instantly, runs securely, and keeps you focused. By using a guilt-free backlog instead of harsh penalties, we encourage consistent, long-term behavior modification over short-lived motivation spikes.
