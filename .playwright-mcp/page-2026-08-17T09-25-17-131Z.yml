        - heading "What is DayTree?" [level=2] [ref=f9e38]
        - paragraph [ref=f9e39]: "DayTree is a modern habit-tracking web application built on the MERN stack. We strip away the gaming loops, bloated features, and noisy popups found in other platforms to give you a stark, clean, distraction-free environment. Our goal is simple: to help you build and maintain daily habits."
        - heading "Daily Habit Tracking" [level=3] [ref=f9e40]
        - paragraph [ref=f9e41]: DayTree divides your commitments by day. Instead of looking at an intimidating list of tasks, you focus solely on what needs to be done during the current day. It is a highly tactical tool designed to keep your daily focus razor-sharp.
      - generic [ref=f9e42]:
        - heading "Designed for consistency" [level=2] [ref=f9e43]
        - paragraph [ref=f9e44]: Ditch the noise. Focus on what you actually do every day.
