        - heading "Why Tracking Every Day Matters" [level=2] [ref=f10e23]
        - paragraph [ref=f10e24]: The difference between a wish and a habit is consistency. Research shows that tracking your goals daily dramatically increases the likelihood of long-term behavior change. By recording your completions every day, you reinforce your identity as a disciplined person.
        - heading "Features Engineered for Daily Use" [level=2] [ref=f10e25]
        - paragraph [ref=f10e26]: "DayTree is designed to be the fastest part of your daily routine. We want you to track your habits and get back to your life. Here is how we support daily consistency:"
