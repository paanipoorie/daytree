            - text: .
          - listitem [ref=f10e31]:
            - strong [ref=f10e32]: "Active Streaks:"
            - text: Track your current daily streak to build momentum and see how long you can keep the chain going.
          - listitem [ref=f10e33]:
            - strong [ref=f10e34]: "Distraction-Free Interface:"
            - text: No popups, ads, or social feeds. Just your daily checklist.
        - heading "How to Succeed with a Daily Routine" [level=2] [ref=f10e35]
        - list [ref=f10e36]:
