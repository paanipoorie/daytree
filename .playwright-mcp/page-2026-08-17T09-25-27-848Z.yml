          - listitem [ref=f10e28]:
            - strong [ref=f10e29]: "Local Timezone Alignment:"
            - text: Daily rollovers align perfectly with your browser's local timezone. You don't have to worry about UTC servers resetting your day early. Learn more in our
            - link "Timezone-Safe Guide" [ref=f10e30] [cursor=pointer]:
